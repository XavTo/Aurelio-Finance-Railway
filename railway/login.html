<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{APP_NAME}} · Private workspace</title><style>body{margin:0;background:#10131d;color:#e7ecf8;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{width:min(380px,80vw);padding:32px;background:#1a2030;border:1px solid #323b53;border-radius:20px}small{color:#9aa9c7}h1{font-size:28px}p{line-height:1.6;color:#aab7d2}label{display:block;margin-bottom:9px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;border:1px solid #495779;background:#101624;color:#fff;font:inherit}button{margin-top:16px;background:#7566e9;cursor:pointer;border:0}#error{color:#ffb9bc;min-height:24px;font-size:14px}</style><main><small>YOUR PRIVATE RAILWAY WORKSPACE</small><h1>{{APP_NAME}}</h1><p>Use the generated <strong>APP_PASSWORD</strong> from your Railway service’s Variables tab.</p><form id="form"><label for="password">Workspace password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button>Sign in</button><p id="error" role="alert"></p></form></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('/_railway/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const j=await r.json();if(!r.ok)throw Error(j.error);location.href='/'}catch(e){document.querySelector('#error').textContent=e.message}finally{b.disabled=false}})</script></html>
